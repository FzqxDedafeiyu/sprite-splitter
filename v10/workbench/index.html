<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>精灵图切分编辑器 V10</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#11151c;color:#e9eef7}
*{box-sizing:border-box}
body{margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 1.6rem;border-bottom:1px solid #303a49;background:#171d26}
h1,h2,p{margin:0} h1{font-size:1.2rem} h2{font-size:1rem}
button,select,input{font:inherit}
button,.file{border:1px solid #414e61;border-radius:6px;background:#232e3c;color:inherit;padding:.45rem .8rem;cursor:pointer;white-space:nowrap}
button.primary{border-color:#759ed7;background:#a4c5f3;color:#111b2b;font-weight:650}
button:disabled,input:disabled+span{opacity:.43;cursor:default}
:focus-visible{outline:2px solid #9ec5ff;outline-offset:2px}
.file{display:inline-flex;align-items:center;gap:.55rem}
.file input{max-width:240px}
main{max-width:1340px;margin:auto;padding:1.4rem 1.6rem}
.toolbar, .actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}
.toolbar select{min-width:190px;max-width:340px;border:1px solid #414e61;border-radius:6px;background:#1b2330;color:inherit;padding:.45rem}
#detection{margin-top:.75rem;padding:.55rem .8rem;color:#bdcbea}
.detection-options{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;padding-top:.5rem}
.detection-options input,.detection-options select{border:1px solid #43526a;border-radius:5px;background:#121a24;color:inherit;padding:.25rem .35rem}
.detection-options input{width:6.5rem}
#status{min-height:2rem;margin-top:1rem;color:#b8cbe5}
#status[data-error="true"]{color:#ffac98}
.panel{border:1px solid #303a49;border-radius:9px;background:#171d26}
#summary{padding:.85rem 1rem;margin:.65rem 0 1rem}
#summary details{margin-top:.55rem;color:#bac6d7}
#summary ul{margin:.35rem 0 0;padding-left:1.2rem;max-height:170px;overflow:auto}
.workspace{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:1rem}
.workspace h2{padding:.75rem 1rem;border-bottom:1px solid #303a49}
#asset-count{display:inline-block;margin-inline-start:.55rem;padding:.05rem .5rem;border:1px solid #475c78;border-radius:999px;background:#243145;color:#c8defc;font-size:.85rem;font-variant-numeric:tabular-nums}
#sprites{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
#sprites button{display:block;width:100%;text-align:left;white-space:normal;border:0;border-bottom:1px solid #303a49;border-radius:0;background:transparent}
#sprites button[aria-current="true"]{background:#283447;color:#cae0ff}
#preview{min-height:265px;display:grid;place-items:center;padding:1.25rem;background:repeating-conic-gradient(#27313d 0% 25%,#1e2732 0% 50%) 50%/24px 24px}
#preview img{max-width:100%;max-height:470px;object-fit:contain;image-rendering:pixelated}
#selection{padding:.8rem 1rem;color:#bfcddd;overflow-wrap:anywhere}
#summary[hidden], #agent-review[hidden], #annotation[hidden], #image[hidden]{display:none}
#agent-review{padding:.85rem 1rem;margin:0 0 1rem}
#agent-review p{margin:.4rem 0}
#agent-review ul{max-height:140px;overflow:auto;margin:.45rem 0;padding-inline-start:1.2rem}
#agent-review ul:empty{display:none}
#source-crop{margin:0 1rem 1rem;padding:.6rem .8rem;color:#c8d8ed}
#crop-surface{position:relative;width:min(100%,var(--crop-width));margin:.65rem auto;cursor:crosshair;touch-action:none;user-select:none;background:repeating-conic-gradient(#303c4a 0% 25%,#1e2732 0% 50%) 50%/16px 16px}
#crop-image{display:block;width:100%;height:auto;image-rendering:pixelated}
.crop-guide{position:absolute;pointer-events:none;outline:2px solid #ffce80;background:#ffce8022}
.crop-guide:first-of-type{outline:1px dashed #a1c8ff;background:transparent}
#crop-fields{grid-template-columns:repeat(4,minmax(0,1fr))}
#crop-fields .actions{grid-column:1/-1}
@media(max-width:560px){#crop-fields{grid-template-columns:1fr 1fr}}
#annotation{padding:0 1rem .8rem;color:#bdcfea;overflow-wrap:anywhere}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:0 1rem 1rem}
fieldset{min-width:0;margin:0;padding:.65rem;border:1px solid #303a49;border-radius:6px;display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
legend{font-weight:650;color:#c8d8ed;padding:0 .25rem}
fieldset label{display:grid;gap:.2rem;color:#c8d1e0}
fieldset input:not([type="checkbox"]),fieldset textarea{width:100%;min-width:0;border:1px solid #43526a;border-radius:5px;background:#121a24;color:inherit;padding:.35rem .45rem}
fieldset .wide{grid-column:1/-1}
fieldset .flag{display:flex;align-items:center;gap:.35rem}
fieldset button{justify-self:start}
fieldset:disabled{opacity:.55}
@media(max-width:900px){.editor{grid-template-columns:1fr}}
@media(max-width:740px){header{align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr}#sprites{max-height:215px}main{padding:1rem}}
</style>
</head>
<body>
<header>
<h1>精灵图切分编辑器 V10</h1>
<div class="actions">
<button type="button" class="primary" id="save" disabled>保存为 V10 项目</button>
<button type="button" id="reload" disabled>重新读取</button>
<button type="button" id="undo" disabled>撤销</button>
<button type="button" id="redo" disabled>重做</button>
<button type="button" id="export" disabled>导出 V9 ZIP</button>
</div>
</header>
<main>
<div class="toolbar" aria-label="项目操作">
<label class="file">导入源图 <input id="source-file" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label class="file">导入 V9 ZIP <input id="zip" type="file" accept=".zip,application/zip"></label>
<label><input id="orphans" type="checkbox">纳入未引用的 PNG</label>
<label class="file">导入 Agent JSON <input id="agent-file" type="file" accept=".json,application/json" disabled></label>
<label for="projects">已保存项目</label>
<select id="projects"><option value="">选择项目</option></select>
</div>
<details id="detection" class="panel">
<summary>自动识别设置</summary>
<div class="detection-options">
<label>方式 <select id="detect-mode"><option value="auto">自动判断</option><option value="alpha">Alpha 透明通道</option><option value="lightbg">浅色背景抠除</option></select></label>
<label>Alpha 阈值 <input id="detect-alpha" type="number" value="16" min="0" max="255" step="1"></label>
<label>背景亮度 <input id="detect-background" type="number" value="220" min="160" max="250" step="1"></label>
<label>最小面积 <input id="detect-area" type="number" value="80" min="1" step="1"></label>
<label>边距 <input id="detect-padding" type="number" value="4" min="0" max="32" step="1"></label>
<label>邻域 <select id="detect-connectivity"><option value="8">8 邻域</option><option value="4">4 邻域</option></select></label>
<button type="button" id="detect-again" disabled>重新识别为新项目</button>
</div>
</details>
<p id="status" role="status" aria-live="polite">正在打开本地存储…</p>
<section id="summary" class="panel" aria-label="迁移报告" hidden>
<p id="summary-text"></p>
<details id="report"><summary>查看迁移提示</summary><ul id="warnings"></ul></details>
</section>
<section id="agent-review" class="panel" aria-label="Agent 标注预览" hidden>
<h2>Agent 标注预览</h2>
<p id="agent-summary"></p>
<ul id="agent-warnings"></ul>
<div class="actions">
<button type="button" class="primary" id="apply-agent" disabled>应用标注</button>
<button type="button" id="cancel-agent" disabled>取消</button>
</div>
</section>
<div class="workspace">
<section class="panel"><h2>素材 <output id="asset-count" aria-label="素材总数">0 个</output></h2><ul id="sprites"></ul></section>
<section class="panel">
<h2>素材预览</h2>
<div id="preview"><img id="image" alt="" hidden></div>
<p id="selection">选择素材查看裁切图。</p><p id="annotation" hidden></p>
<div class="editor">
<form id="metadata-form">
<fieldset id="metadata-fields" disabled>
<legend>素材属性</legend>
<label>名称<input id="sprite-name" required></label>
<label>分类<input id="sprite-category"></label>
<label class="wide">描述<textarea id="sprite-description" rows="2"></textarea></label>
<button type="submit">保存属性</button>
</fieldset>
</form>
<form id="scene-form">
<fieldset id="scene-fields" disabled>
<legend>场景属性</legend>
<label>X<input id="scene-x" type="number" step="any" required></label>
<label>Y<input id="scene-y" type="number" step="any" required></label>
<label>层级顺序<input id="scene-z" type="number" step="1" required></label>
<label class="flag"><input id="scene-visible" type="checkbox">显示</label>
<label class="flag"><input id="scene-locked" type="checkbox">锁定位置</label>
<button type="submit">保存场景属性</button>
</fieldset>
</form>
</div>
<details id="source-crop" class="panel" hidden>
<summary>在源图上调整裁切框</summary>
<div id="crop-surface">
<img id="crop-image" alt="当前项目的原始图像" draggable="false">
<div id="crop-original" class="crop-guide" hidden></div>
<div id="crop-draft" class="crop-guide" hidden></div>
</div>
<form id="crop-form">
<fieldset id="crop-fields" disabled>
<legend>拖出新裁切框，或输入原图像素坐标</legend>
<label>X<input id="crop-x" type="number" min="0" step="1" required></label>
<label>Y<input id="crop-y" type="number" min="0" step="1" required></label>
<label>宽<input id="crop-w" type="number" min="1" step="1" required></label>
<label>高<input id="crop-h" type="number" min="1" step="1" required></label>
<div class="actions"><button type="submit">保存裁切框</button><button id="crop-reset" type="button">重置选框</button></div>
</fieldset>
</form>
</details>
</section>
</div>
</main>
<!-- WORKBENCH_SCRIPT -->
</body>
</html>
